name: Validate & Release OpenAPI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-openapi:
    runs-on: ubuntu-latest
    outputs:
      specsChanged: ${{ steps.lint-openapi.outputs.SPECS_CHANGED }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v2
      - uses: pnpm/action-setup@v3
      - name: Validate OpenAPI specs
        id: lint-openapi
        run: |
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
              BASE_COMMIT="HEAD^"
          else
              BASE_COMMIT="origin/main"
          fi

          if git diff --quiet "$BASE_COMMIT" -- openapi/; then
              echo "No OpenAPI spec changes detected. Exiting."
              echo "SPECS_CHANGED=false" >> $GITHUB_OUTPUT
              exit 0
          fi

          echo "SPECS_CHANGED=true" >> $GITHUB_OUTPUT

          echo "Installing dependencies..."
          pnpm install --frozen-lockfile

          echo "Running OpenAPI lint..."
          pnpm lint:openapi

  validate-version:
    runs-on: ubuntu-latest
    needs: [lint-openapi]
    if: needs.lint-openapi.outputs.specsChanged == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
      - uses: actions/setup-node@v2
      - uses: pnpm/action-setup@v3
      - name: Validate API version
        run: |
          input_version=$(<VERSION)

          read input_major input_minor input_patch <<< $(echo "$input_version" | awk -F'[.v-]' '{print $1, $2, $3}')

          # Check if patch version is properly incremented
          patch_version_search="v$input_major.$input_minor.*"
          latest_version=$(git tag -l $patch_version_search --sort=-taggerdate | head -n 1)
          if [ -n "$latest_version" ]; then
              read major minor patch <<< $(echo "$latest_version" | awk -F'[.v-]' '{print $1, $2, $3}')
              expected_patch=$((patch + 1))

              if [ "$input_patch" != "$expected_patch" ]; then
                  echo "Updating patch version failed: expected ${major}.${minor}.${expected_patch}, got ${input_version}"
                  exit 1
          fi
          else
              # Check if minor version is properly incremented 
              minor_version_search="v$input_major.*"
              latest_version=$(git tag -l $minor_version_search --sort=-taggerdate | head -n 1)
              if [ -n "$latest_version" ]; then
                  read major minor <<< $(echo "$latest_version" | awk -F'[.v-]' '{print $1, $2}')
                  expected_minor=$((minor + 1))
                  expected_patch="0"

                  if [ "$input_minor" != "$expected_minor" ]; then
                      echo "Updating minor version failed, expected ${major}.${expected_minor}.${expected_patch}, got ${input_version}"
                      exit 1
                  elif [ "$input_patch" != "$expected_patch" ]; then
                      echo "Updating minor version failed, expected ${major}.${expected_minor}.${expected_patch}, got ${input_version}"
                  fi
              fi
          fi
      - name: Validate API version across specs
        run: | 
          expected_version=$(<VERSION)
          files=(openapi/*.yaml)

          all_match=true

          for file in "${files[@]}"; do
            version=$(yq e '.info.version' "$file")
            if [ "$version" != "$expected_version" ]; then
              echo "Expected version $expected_version in $file, got $version"
              all_match=false
            fi
          done

          $all_match && exit 0 || exit 1
  release:
    runs-on: ubuntu-latest
    needs: [validate-version]
    if: github.ref == 'refs/heads/main'
    outputs:
      tagName: ${{ steps.create-tag.outputs.tag_name }}
      releaseUrl: ${{ steps.create-release.outputs.html_url }}
      releaseBody: ${{ steps.changelog.outputs.changes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Create Tag
        id: create-tag
        run: |
          VERSION=$(<VERSION)
          TAG_NAME="v$VERSION"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a $TAG_NAME -m "$TAG_NAME"
          git push origin $TAG_NAME
      - name: Generate CHANGELOG data
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          token: ${{ github.token }}
          tag: ${{ env.TAG_NAME }}
          includeRefIssues: false
      - name: Create Release
        id: create-release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          draft: false
          makeLatest: true
          name: ${{ env.TAG_NAME }}
          body: ${{ steps.changelog.outputs.changes }}
          tag: ${{ env.TAG_NAME }}
          token: ${{ github.token }}

  notify-sdks:
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - name: Check version
        id: check-version
        run: |
          tag_name="${{ needs.release.outputs.tagName }}"
          read major minor patch <<< $(echo "$tag_name" | sed 's/^v//' | awk -F'[.v-]' '{print $1, $2, $3}')
          
          echo "Version: $tag_name (major: $major, minor: $minor, patch: $patch)"
          
          # Check if it's a minor or major update (patch version is 0)
          if [ "$patch" == "0" ]; then
            echo "at_least_minor_version_update=true" >> "$GITHUB_OUTPUT"
            echo "version=${tag_name#v}" >> "$GITHUB_OUTPUT"
          else
            echo "at_least_minor_version_update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create issues in SDK repositories
        if: steps.check-version.outputs.at_least_minor_version_update == 'true'
        uses: actions/github-script@v9
        env:
          VERSION: ${{ steps.check-version.outputs.version }}
          TAG_NAME: ${{ needs.release.outputs.tagName }}
          RELEASE_URL: ${{ needs.release.outputs.releaseUrl }}
          RELEASE_BODY: ${{ needs.release.outputs.releaseBody }}
        with:
          github-token: ${{ secrets.SDK_REPO_NOTIFIER_TOKEN }}
          script: |
            const repos = [
              "open-payments-node",
              "open-payments-rust",
              "open-payments-php",
              "open-payments-dotnet",
              "open-payments-java",
              "open-payments-go"
            ];
            
            const version = process.env.VERSION;
            const release = {
              tag_name: process.env.TAG_NAME,
              html_url: process.env.RELEASE_URL,
              body: process.env.RELEASE_BODY
            };
            const headers = {
              'X-GitHub-Api-Version': '2026-03-10'
            };
            
            const body = `## Specification Update

            A new version of the Open Payments specifications has been released: [${release.tag_name}](${release.html_url}).

            ### Todo
            - [ ] Review the changes in the latest specification
            - [ ] Update the SDK to maintain feature compatibility
            - [ ] Release a new version of the SDK
            - [ ] If applicable, you will be assigned an issue to add or update snippets in the Open Payments docs by the technical writing team

            <details>
            <summary><b>View Release Notes</b></summary>

            ${release.body}

            </details>

            ---
            *This issue was automatically created by the SDK notifier job of the Validate & Release OpenAPI workflow in [interledger/open-payments-specifications](https://github.com/interledger/open-payments-specifications).*`;

            const createdIssueUrls = [];

            for (const sdkRepo of repos) {
              const issueTitle = `Update to Open Payments Specification v${version}`;
              try {
                // Check if issue already exists
                const { data: { items: existingIssues } } = await github.rest.search.issuesAndPullRequests({
                  q: `repo:interledger/${sdkRepo} is:issue "${issueTitle}" in:title`,
                  headers
                });

                const existingIssue = existingIssues.find(i => i.title === issueTitle);
                if (existingIssue) {
                   console.log(`Issue already exists in interledger/${sdkRepo}: ${existingIssue.html_url}`);
                   createdIssueUrls.push(existingIssue.html_url);
                   continue;
                }

                console.log(`Creating issue in interledger/${sdkRepo}`);
                const { data: issue } = await github.rest.issues.create({
                  owner: 'interledger',
                  repo: sdkRepo,
                  title: issueTitle,
                  body,
                  headers
                });
                createdIssueUrls.push(issue.html_url);
              } catch (error) {
                core.error(`Failed to create issue in interledger/${sdkRepo}: ${error.message}`);
              }
            }

            if (createdIssueUrls.length > 0) {
              try {
                const summaryTitle = `SDK updates for Open Payments Specification v${version}`;
                const statusIssueBody = `## SDK Update Status

                This issue tracks the SDK updates for the new version of the specifications: [${release.tag_name}](${release.html_url}).\n
                
                ### Issues

                ${createdIssueUrls.map(issueUrl => `- [ ] ${issueUrl}`).join('\n')}

                ---
                *This issue was automatically created by the SDK notifier job of the Validate & Release OpenAPI workflow.*`.replace(/^\s+/gm, '');
                
                // Check if summary issue already exists
                const { data: { items: existingSummaries } } = await github.rest.search.issuesAndPullRequests({
                  q: `repo:interledger/open-payments is:issue "${summaryTitle}" in:title`,
                  headers
                });

                const existingSummary = existingSummaries.find(i => i.title === summaryTitle);
                if (existingSummary) {
                  console.log(`Updating existing summary issue in interledger/open-payments: ${existingSummary.html_url}`);
                  await github.rest.issues.update({
                    owner: 'interledger',
                    repo: 'open-payments',
                    issue_number: existingSummary.number,
                    body: statusIssueBody,
                    headers
                  });
                } else {
                  console.log('Creating summary issue in interledger/open-payments');
                  await github.rest.issues.create({
                    owner: 'interledger',
                    repo: 'open-payments',
                    title: summaryTitle,
                    body: statusIssueBody,
                    headers
                  });
                }
              } catch (error) {
                core.error(`Failed to create summary issue in interledger/open-payments: ${error.message}`);
              }
            }
